train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/gpp/gpp_01deg_input_x5
      root_path_2: ./load/gpp/gpp_001deg_output
      topo_nc_path: /home/share/KCP/2026/INR/_nc/elev_SRTM_v11_001deg.nc
      # meta_path: ./load/climate/meta/train_imerg80x100_meta.json
      cache: in_memory
  wrapper:
    name: sr-implicit-paired-topo-enc
    args:
      # inp_size: 24
      obs_state: False
      sample_q: 1024
      augment: false
  batch_size: 16
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/gpp/gpp_01deg_input_val_x5
      root_path_2: ./load/gpp/gpp_001deg_output_val
      topo_nc_path: /home/share/KCP/2026/INR/_nc/elev_SRTM_v11_001deg.nc
      # meta_path: ./load/climate/meta/val_imerg80x100.json
      cache: in_memory
  wrapper:
    name: sr-implicit-paired-topo-enc
    args:
      # inp_size: 24
      sample_q: 1024
      obs_state: False
      augment: false
  batch_size: 16
data_norm:
  inp:
    sub:
    - 0.5
    div:
    - 0.5
  gt:
    sub:
    - 0.5
    div:
    - 0.5
model:
  name: liif_topo_encoder
  args:
    encoder_spec:
      name: edsr
      args:
        no_upsampling: true
    topo_encoder_spec:
      name: edsr
      args:
        no_upsampling: true
        n_feats: 16
        n_resblocks: 4
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 700
# resume: /home/inhye_yoo/deeplearning/inr/liif/save/_climate_edsr_toponew_80x100/epoch-last.pth
multi_step_lr:
  milestones:
  - 200
  - 400
  - 600
  gamma: 0.5
epoch_val: 1
epoch_save: 1
