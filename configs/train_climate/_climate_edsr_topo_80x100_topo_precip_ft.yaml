train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/climate/climate_train_korea_imerg40x50_1998_2002
      root_path_2: ./load/climate/climate_train_korea_imerg80x100_1998_2002
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_Ice_g_gmt4_kor.nc
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/1998-2009/preprocessed_obs_hourly_to_daily_precip_1998_2009_final.csv
      meta_path: ./load/climate/meta/climate_train_korea_imerg100.json
      cache: in_memory
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
  batch_size: 16
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/climate/climate_val_korea_imerg40x50_2020_2022
      root_path_2: ./load/climate/climate_val_korea_imerg80x100_2020_2022
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_Ice_g_gmt4_kor.nc
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/1998-2009/preprocessed_obs_hourly_to_daily_precip_1998_2009_final.csv
      meta_path: ./load/climate/meta/climate_train_korea_imerg100.json
      cache: in_memory
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
  batch_size: 16
data_norm:
  inp:
    sub:
    - 0.5
    div:
    - 0.5
  gt:
    sub:
    - 0.5
    div:
    - 0.5
model:
  name: liif
  args:
    encoder_spec:
      name: edsr
      args:
        no_upsampling: true
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
    layer_spec:
      name: adapter
      args:
        out_dim: 1
    extra_in_dim: 1
optimizer:
  name: adam
  args:
    lr: 0.0001
epoch_max: 700
resume: /home/inhye_yoo/deeplearning/inr/liif/save/_climate_edsr_topo_80x100_topo_precip/epoch-last.pth
epoch_val: 1
epoch_save: 1
