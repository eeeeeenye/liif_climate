train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/HSR_train_norm_2x.nc
      root_path_2: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/HSR_train_500m_norm.nc
      var_name: precip_norm
      load_into_memory: false   # HR 500m train nc가 117GB라 전체 메모리 로드 불가 (매 idx마다 disk read)
      # topo_nc_path / obs_path_3: 아직 미사용 (pretrain 단계)
  wrapper:
    name: sr-implicit-paired
    args:
      inp_size: 48   # LR(2x, ~1153x1441)에서 48x48 랜덤 crop (DIV2K 관례와 동일)
      obs_state: false
      sample_q: 1024
      augment: true
  batch_size: 16
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/HSR_val_norm_2x.nc
      root_path_2: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/HSR_val_500m_norm.nc
      var_name: precip_norm
      load_into_memory: false
  wrapper:
    name: sr-implicit-paired
    args:
      inp_size: 48
      obs_state: false
      sample_q: 1024
      augment: false
  batch_size: 16
physical_norm:
  type: minmax
  min: 0.0
  max: 74.8784   # split.sh 가 train(2019-2020 JJA)만으로 계산한 GMAX (data leakage 없음, val 도 동일 적용)
model:
  name: lte
  args:
    encoder_spec:
      name: edsr
      args:
        no_upsampling: true
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
    # extra_in_dim 없음: topo_nc_path 미사용이라 topo 채널 없음 (기본값 0)
    # layer_spec(adapter) 미사용: pretrain 단계라 correction_layer 항등 함수로 동작
optimizer:
  name: adam
  args:
    lr: 0.0001
epoch_max: 300
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5
# resume 없음: LTE는 liif 체크포인트와 파라미터 구조가 달라 from scratch 로만 시작 가능
epoch_val: 1
epoch_save: 1
