train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/climate/climate_train_korea_imerg40x50_1998_2009_prcp200
      root_path_2: ./load/climate/climate_train_korea_imerg80x100_1998_2009_prcp200
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_on_IMERG_Land.nc
      obs_path_3: /home/inhye_yoo/deeplearning/inr/liif/asos_data/ASOS_precip_1998_2009_prcp200.csv
      meta_path: /home/inhye_yoo/deeplearning/inr/liif/load/climate/meta/train_imerg80x100_meta_prcp200.json
      cache: in_memory
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
  batch_size: 204
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/deeplearning/inr/liif/load/climate/climate_val_korea_imerg40x50_2010_2022_prcp200
      root_path_2: /home/inhye_yoo/deeplearning/inr/liif/load/climate/climate_val_korea_imerg80x100_2010_2022_prcp200
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_on_IMERG_Land.nc
      obs_path_3: /home/inhye_yoo/deeplearning/inr/liif/data_to_img/ASOS_precip200_2010_2022.csv
      meta_path: /home/inhye_yoo/deeplearning/inr/liif/load/climate/meta/train_imerg80x100_meta_prcp200.json
      cache: in_memory
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
  batch_size: 150
data_norm:
  inp:
    sub:
    - 0.5
    div:
    - 0.5
  gt:
    sub:
    - 0.5
    div:
    - 0.5
model:
  name: liif
  args:
    encoder_spec:
      name: edsr
      args:
        no_upsampling: true
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
    layer_spec:
      name: adapter
      args:
        out_dim: 1
    extra_in_dim: 1
optimizer:
  name: sgd
  args:
    lr: 0.01
epoch_max: 2000
resume: /home/inhye_yoo/deeplearning/inr/liif/save/_climate_edsr_imerg_obs_topo_chmeta_final/epoch-last.pth
epoch_val: 1
epoch_save: 1
