# Reference-informed 2x LTE+LoRA finetuning, train=2019+2020 JJA; val=2021 JJA.
# Before running, create the cropped 2x input once:
#   bash /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/codes/make_2019_2020_2x_obscrop.sh

train_dataset:
  dataset:
    name: paired-image-folders
    args:
      # 4416 hourly fields: 2019 JJA + 2020 JJA. The 2x input and 500m target
      # share the same ASOS-cropped domain and the matching 2019_2020 metadata.
      root_path_1: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/regrid/HSR_train_norm_2x_obscrop.nc
      root_path_2: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/HSR_2019_2020JJA_500m_norm_obscrop.nc
      var_name: precip_norm
      load_into_memory: true
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/obs_hourly_HSR_500m_2019_2020JJA_obscrop_lag1h_train.csv
      meta_path: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/meta_HSR_500m_2019_2020JJA_obscrop_lag1h_train.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
      inp_size: 48
  batch_size: 64

val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/regrid/HSR_val_norm_2x_obscrop.nc
      root_path_2: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/regrid/HSR_val_500m_norm_obscrop.nc
      var_name: precip_norm
      load_into_memory: true
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/obs_hourly_HSR_500m_2019JJA_obscrop_lag1h_val.csv
      meta_path: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/meta_HSR_500m_2019JJA_obscrop_lag1h_val.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
      inp_size: 48
  batch_size: 32

physical_norm:
  type: minmax
  min: 0.0
  max: 74.8784

finetune_from: /home/inhye_yoo/deeplearning/inr/liif/save/_climate_edsr_radar_hsr_2x_minmax_lte/epoch-last.pth

lora:
  rank: 16
  layers: no_first

lora_plus:
  enabled: true
  b_lr_ratio: 4.0

loss:
  name: balanced_huber
  args:
    bins_mm_h: [2.0, 5.0, 10.0, 30.0]
    weights: [1.0, 1.0, 2.0, 5.0, 10.0]
huber_delta: 0.01
rel_eps: 0.01

functional_distill:
  weight: 0.05
  sample_q: 128
  loss: mse
  cell_mode: both
  grid_scale: 2

val_seed: 0

optimizer:
  name: adam
  args:
    lr: 0.002

epoch_max: 200
epoch_val: 1
epoch_save: 5
early_stopping:
  patience: 25
  min_delta: 0.0
