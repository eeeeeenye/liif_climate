# =====================================================================
# model B(_climate_edsr_radar_hsr_2x_minmax_liif) finetune: plain MLP adapter + Weighted-MAE,
# 학습 데이터를 2019 JJA -> 2019+2020 JJA 로 확장한 버전.
#   [2026-09-23] climate_edsr_radar_hsr_2x_minmax_liif_ft_mlp_1e-3_lag1h_vzero_wmae_plainadapter.yaml 에서
#   train만 2019_2020(non-vzero, lag1h) 로 교체. val은 그대로 2021 JJA(vzero val) 유지해서
#   heavy ratio 등 지표를 기존 2019-only 런과 직접 비교 가능하게 함.
#
#   동기: 8x 모델에서 이미 확인된 현상(climate_edsr_radar_hsr_8x_minmax_liif_ft_mlp_1e-3_lag1h_2019_2020.yaml
#   주석 참고) - 2019만 쓰면 HSR-ASOS 관계(OLS 기울기 0.98)만 배우는데, 2020/2021은 기울기가 훨씬 가파름
#   (2019+2020 결합 OLS 기울기 1.33). adapter_fold_hsr_2x_wmae_plainadapter.py 로 그린 우리 2x 모델의
#   transfer function도 2019-only OLS(0.98)를 넘지 않는 완만한 곡선이었음 -> 2019+2020으로 늘리면
#   더 가파른(=heavy tail 을 더 세게 올리는) 곡선을 배울 걸로 기대.
#
#   train 데이터: obs 74,390건(2019 28,468 + 2020 45,922), non-vzero(라벨 32%가 0; vzero 버전은
#   2020 KMA 일강수량 재생성이 아직 안 돼서 이번엔 non-vzero로 진행). 4416시간(2019+2020 JJA).
#   입력 nc: regrid/HSR_train_norm_2x_obscrop.nc (make_2019_2020_2x_obscrop.sh 로 새로 생성, 2026-09-23)
#
#   step 수가 거의 2배(276->552 train step/epoch)라 같은 epoch_max 라도 epoch당 시간이 ~2배.
#
#   실행:
#     python train_liif_finetune_vzero_wmae.py \
#       --config configs/train_climate/climate_edsr_radar_hsr_2x_minmax_liif_ft_mlp_1e-3_lag1h_2019_2020_wmae_plainadapter.yaml \
#       --gpu 2
# =====================================================================

train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/regrid/HSR_train_norm_2x_obscrop.nc
      root_path_2: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/HSR_2019_2020JJA_500m_norm_obscrop.nc
      var_name: precip_norm
      load_into_memory: true
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/obs_hourly_HSR_500m_2019_2020JJA_obscrop_lag1h_train.csv
      meta_path: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/meta_HSR_500m_2019_2020JJA_obscrop_lag1h_train.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
      inp_size: 48
  batch_size: 64
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/regrid/HSR_val_norm_2x_obscrop.nc
      root_path_2: /home/inhye_yoo/data/radar_HSR/hsr_hourly_precip_nc/merge/regrid/HSR_val_500m_norm_obscrop.nc
      var_name: precip_norm
      load_into_memory: true
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/obs_hourly_HSR_500m_2019JJA_obscrop_lag1h_vzero_val.csv
      meta_path: /home/inhye_yoo/data/observation/raw/ASOS/hourly/hsr_obs/meta_HSR_500m_2019JJA_obscrop_lag1h_vzero_val.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
      inp_size: 48
  batch_size: 32

physical_norm:
  type: minmax
  min: 0.0
  max: 74.8784

resume: /home/inhye_yoo/deeplearning/inr/liif/save/_climate_edsr_radar_hsr_2x_minmax_liif/epoch-last.pth

model:
  name: liif
  args:
    encoder_spec:
      name: edsr
      args:
        no_upsampling: true
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
    layer_spec:
      name: adapter   # plain MLP adapter (랜덤 초기화), 기존 2019-only wmae 런과 동일 아키텍처
      args:
        out_dim: 1
        hidden_dims:
        - 32
        - 16
        - 32

optimizer:
  name: adam
  args:
    lr: 0.001

epoch_max: 500   # resume 300 epoch -> 실질 200 epoch. step이 2배라 epoch당 시간도 ~2배 (기존 run 대비)
epoch_val: 1
epoch_save: 10

loss: wmae
wmae:
  w_min_mm: 1.0
  w_max_mm: 30.0
  normalize_by_weight: true
