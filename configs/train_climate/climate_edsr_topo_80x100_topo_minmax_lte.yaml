train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_02deg_1998_2009_minmax.nc
      root_path_2: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_01deg_1998_2009_minmax.nc
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_Ice_g_gmt4_kor.nc
      topo_kwargs:
        normalize: standard_tanh
      # obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/model_input/preprocessed_obs_daily_precip_1998_2009_utc.csv
      # meta_path: /home/inhye_yoo/deeplearning/inr/liif/load/climate/meta/train_imerg80x100_meta.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: false   # obs_path_3 없이 테스트: HR 그리드에서 sample_q개 샘플링
      sample_q: 1024
      augment: false
  batch_size: 16
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_02deg_2020_2022_minmax.nc
      root_path_2: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_01deg_2020_2022_minmax.nc
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_Ice_g_gmt4_kor.nc
      topo_kwargs:
        normalize: standard_tanh
      # obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/preprocessing_codes/preprocessed_obs_daily_precip_2020_2022_utc_1095.csv
      # meta_path: /home/inhye_yoo/deeplearning/inr/liif/load/climate/meta/train_imerg80x100_meta.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: false
      sample_q: 1024
      augment: false
  batch_size: 16
physical_norm:
  type: minmax
  min: 0.0
  max: 506.01995849609375
model:
  name: lte
  args:
    encoder_spec:
      name: edsr
      args:
        no_upsampling: true
    # topo_encoder_spec:
    #   name: edsr
    #   args:
    #     no_upsampling: true
    #     n_feats: 16
    #     n_resblocks: 4
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
    # adapter 미사용 (layer_spec 제거 시 correction_layer는 항등 함수로 동작)
    # layer_spec:
    #   name: adapter
    #   args:
    #     out_dim: 1
    #     hidden_dims:
    #     - 32
    #     - 16
    #     - 32
    extra_in_dim: 1   # topo 채널 수: elevation (slope/relief 제거됨)
optimizer:
  name: adam
  args:
    lr: 0.0001
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5
epoch_max: 20     # LTE 동작 확인용 짧은 런 (제대로 학습할 땐 늘릴 것)
# resume 없음: LTE는 liif 체크포인트와 파라미터 구조가 달라 from scratch 로만 시작 가능
epoch_val: 1
epoch_save: 1
