# =====================================================================
# 얼린 LTE(_climate_edsr_topo_80x100_topo_minmax_lte) 위에
# ANP(attention) 식 확률적 adapter 학습.
#   cnp_adapter_lte_minmax.yaml 과 동일하나 model 만 anp-adapter.
#   mean aggregation -> cross-attention 으로 국소 보정 강화 목적.
#   실행:
#     python train_anp_adapter.py \
#       --config configs/train_climate/anp_adapter_lte_minmax.yaml --gpu 1
# =====================================================================

train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_02deg_1998_2009_minmax.nc
      root_path_2: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_01deg_1998_2009_minmax.nc
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_Ice_g_gmt4_kor.nc
      topo_kwargs:
        normalize: standard_tanh
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/preprocessing_codes/preprocessed_obs_daily_precip_1998_2009_utc_4380.csv
      meta_path: /home/inhye_yoo/deeplearning/inr/liif/load/climate/meta/train_imerg80x100_meta.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
  batch_size: 16
val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_02deg_2020_2022_minmax.nc
      root_path_2: /home/inhye_yoo/data/IMERG/Imerg_raw/kor_data/minmax_norm/imerg_precip_korea_daily_01deg_2020_2022_minmax.nc
      topo_nc_path: /home/inhye_yoo/data/level/NOAA_ETOPO1_topo/ETOPO1_Ice_g_gmt4_kor.nc
      topo_kwargs:
        normalize: standard_tanh
      obs_path_3: /home/inhye_yoo/data/observation/raw/ASOS/hourly/preprocessing_codes/preprocessed_obs_daily_precip_2020_2022_utc_4380.csv
      meta_path: /home/inhye_yoo/deeplearning/inr/liif/load/climate/meta/train_imerg80x100_meta.json
  wrapper:
    name: sr-implicit-paired-ft
    args:
      obs_state: true
      sample_q: 1024
      augment: false
  batch_size: 16

physical_norm:
  type: minmax
  min: 0.0
  max: 506.01995849609375

lte_from: /home/inhye_yoo/deeplearning/inr/liif/save/_climate_edsr_topo_80x100_topo_minmax_lte/epoch-last.pth

# ---- ANP adapter (models/anp_adapter.py) --------------------------
model:
  name: anp-adapter
  args:
    coord_dim: 2
    y0_dim: 1
    residual_dim: 1
    enc_hidden: [128, 128]     # value encoder f_v
    r_dim: 128                 # = attention embed_dim (r_dim % n_heads == 0)
    kq_hidden: [128]           # key/query encoder f_k, f_q
    n_heads: 4
    dec_hidden: [128, 128, 128]
    use_global: true           # 전역 mean(v_i) 도 decoder 입력에 concat
    min_sigma: 1.0e-4
    init_sigma_bias: -2.0

loss:
  name: gaussian_nll
  args:
    beta: 0.0
loss_space: normalized

context_target:
  ctx_ratio: 0.6
  min_context: 3
  min_target: 2
  val_split_seed: 1234

optimizer:
  name: adam
  args:
    lr: 1.0e-3

epoch_max: 200
epoch_val: 1
epoch_save: 10
